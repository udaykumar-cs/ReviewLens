<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="450" fill="#f8fafc" />

  <text x="40" y="45" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">📊 Product View Breakdown (Sentiment Split &amp; Top Issues)</text>
  <text x="40" y="68" font-family="sans-serif" font-size="12" fill="#64748b">Each product card displays individual sentiment percentage splits and primary defect categories:</text>

  <!-- Product 1: Wireless Earbuds -->
  <g transform="translate(40, 95)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)" />
    <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Wireless Earbuds X2</text>
    <rect x="210" y="14" width="55" height="18" rx="4" fill="#f1f5f9" />
    <text x="217" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">7 reviews</text>

    <!-- Sentiment bar -->
    <rect x="16" y="45" width="248" height="8" rx="4" fill="#e2e8f0" />
    <rect x="16" y="45" width="36" height="8" rx="4" fill="#10b981" />
    <rect x="52" y="45" width="70" height="8" fill="#94a3b8" />
    <rect x="122" y="45" width="142" height="8" rx="4" fill="#ef4444" />

    <text x="16" y="70" font-family="sans-serif" font-size="10" fill="#059669" font-weight="bold">14% Pos</text>
    <text x="110" y="70" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="bold">29% Neu</text>
    <text x="210" y="70" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">57% Neg</text>

    <line x1="16" y1="85" x2="264" y2="85" stroke="#f1f5f9" />
    <text x="16" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Top Issues:</text>
    <rect x="16" y="115" width="52" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="24" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">quality</text>
    <rect x="74" y="115" width="56" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="82" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">support</text>
  </g>

  <!-- Product 2: Ceramic Coffee Mug -->
  <g transform="translate(360, 95)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)" />
    <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Ceramic Coffee Mug (Set of 2)</text>
    <rect x="210" y="14" width="55" height="18" rx="4" fill="#f1f5f9" />
    <text x="217" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">6 reviews</text>

    <!-- Sentiment bar -->
    <rect x="16" y="45" width="248" height="8" rx="4" fill="#e2e8f0" />
    <rect x="16" y="45" width="124" height="8" rx="4" fill="#10b981" />
    <rect x="140" y="45" width="41" height="8" fill="#94a3b8" />
    <rect x="181" y="45" width="83" height="8" rx="4" fill="#ef4444" />

    <text x="16" y="70" font-family="sans-serif" font-size="10" fill="#059669" font-weight="bold">50% Pos</text>
    <text x="110" y="70" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="bold">17% Neu</text>
    <text x="210" y="70" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">33% Neg</text>

    <line x1="16" y1="85" x2="264" y2="85" stroke="#f1f5f9" />
    <text x="16" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Top Issues:</text>
    <rect x="16" y="115" width="52" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="24" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">quality</text>
    <rect x="74" y="115" width="56" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="82" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">support</text>
  </g>

  <!-- Product 3: Running Shoes Pro -->
  <g transform="translate(680, 95)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)" />
    <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Running Shoes Pro</text>
    <rect x="210" y="14" width="55" height="18" rx="4" fill="#f1f5f9" />
    <text x="217" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">6 reviews</text>

    <!-- Sentiment bar -->
    <rect x="16" y="45" width="248" height="8" rx="4" fill="#e2e8f0" />
    <rect x="16" y="45" width="124" height="8" rx="4" fill="#10b981" />
    <rect x="140" y="45" width="41" height="8" fill="#94a3b8" />
    <rect x="181" y="45" width="83" height="8" rx="4" fill="#ef4444" />

    <text x="16" y="70" font-family="sans-serif" font-size="10" fill="#059669" font-weight="bold">50% Pos</text>
    <text x="110" y="70" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="bold">17% Neu</text>
    <text x="210" y="70" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">33% Neg</text>

    <line x1="16" y1="85" x2="264" y2="85" stroke="#f1f5f9" />
    <text x="16" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Top Issues:</text>
    <rect x="16" y="115" width="56" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="24" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">size_fit</text>
    <rect x="78" y="115" width="52" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="86" y="129" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">quality</text>
  </g>
</svg>
