<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="1200" height="700" fill="#0B0F19" />

  <!-- Navbar -->
  <rect width="1200" height="64" fill="#111726" stroke="#1e293b" />
  <rect x="30" y="14" width="36" height="36" rx="8" fill="url(#cyberGrad)" />
  <text x="76" y="38" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Review<tspan fill="#06b6d4">Lens</tspan></text>
  <rect x="195" y="20" width="165" height="24" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="207" y="36" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">ENGINE: GEMINI (28 CACHED)</text>

  <rect x="880" y="16" width="170" height="34" rx="8" fill="#064e3b" stroke="#059669" />
  <text x="900" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">✓ Load Sample (30 reviews)</text>

  <rect x="1065" y="16" width="105" height="34" rx="8" fill="#1e293b" stroke="#475569" />
  <text x="1080" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Reset Cache</text>

  <!-- Telemetry Strip -->
  <rect x="40" y="78" width="1120" height="36" rx="8" fill="#111726" stroke="#1e293b" />
  <text x="56" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="#06b6d4">⚡ TELEMETRY:</text>
  <text x="180" y="100" font-family="monospace" font-size="11" fill="#94a3b8">Processing: <tspan fill="#ffffff" font-weight="bold">0.02s</tspan></text>
  <text x="350" y="100" font-family="monospace" font-size="11" fill="#94a3b8">AI Calls: <tspan fill="#34d399" font-weight="bold">6</tspan></text>
  <text x="500" y="100" font-family="monospace" font-size="11" fill="#94a3b8">Cache Hits: <tspan fill="#38bdf8" font-weight="bold">28</tspan></text>
  <text x="680" y="100" font-family="monospace" font-size="11" fill="#94a3b8">Sanitized/Skipped: <tspan fill="#fbbf24" font-weight="bold">2</tspan></text>
  <text x="920" y="100" font-family="monospace" font-size="11" fill="#a855f7">Defended: <tspan fill="#e879f9" font-weight="bold">1 Injection (R012)</tspan></text>

  <!-- Executive AI Briefing Box -->
  <rect x="40" y="124" width="1120" height="65" rx="10" fill="#161F33" stroke="#3b82f6" stroke-opacity="0.4" />
  <text x="56" y="146" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">🧠 EXECUTIVE AI BRIEFING:</text>
  <text x="56" y="168" font-family="sans-serif" font-size="11" fill="#e2e8f0">Store Sentiment Health is rated <tspan fill="#06b6d4" font-weight="bold">Moderate Attention Needed</tspan> (41.4% positive vs 41.4% negative). High praise for bedsheet fabric and mugs, but severe defect friction in audio hardware (Earbuds X2) and footwear sizing. <tspan fill="#fbbf24" font-weight="bold">12 customer reviews require urgent merchant intervention.</tspan></text>

  <!-- 6 Metric Cards -->
  <!-- Card 1: Total -->
  <g transform="translate(40, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#1e293b" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">TOTAL VOLUME</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">30</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">29 analyzed</text>
  </g>

  <!-- Card 2: Positive -->
  <g transform="translate(230, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#059669" stroke-opacity="0.3" />
    <rect width="3" height="80" rx="1.5" fill="#10b981" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981">POSITIVE</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">41.4%</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">12 reviews</text>
  </g>

  <!-- Card 3: Neutral -->
  <g transform="translate(420, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#475569" stroke-opacity="0.3" />
    <rect width="3" height="80" rx="1.5" fill="#64748b" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">NEUTRAL</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">17.2%</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">5 reviews</text>
  </g>

  <!-- Card 4: Negative -->
  <g transform="translate(610, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#e11d48" stroke-opacity="0.3" />
    <rect width="3" height="80" rx="1.5" fill="#f43f5e" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f43f5e">NEGATIVE</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">41.4%</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">12 reviews</text>
  </g>

  <!-- Card 5: Needs Reply -->
  <g transform="translate(800, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#d97706" stroke-opacity="0.3" />
    <rect width="3" height="80" rx="1.5" fill="#f59e0b" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">NEEDS REPLY</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#f59e0b">12</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">Defects &amp; friction</text>
  </g>

  <!-- Card 6: Rating Agreement -->
  <g transform="translate(990, 200)">
    <rect width="170" height="80" rx="8" fill="#111726" stroke="#6366f1" stroke-opacity="0.3" />
    <rect width="3" height="80" rx="1.5" fill="#6366f1" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">RATING FIDELITY</text>
    <text x="14" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8">96.3%</text>
    <text x="14" y="68" font-family="sans-serif" font-size="10" fill="#64748b">1 mismatch flagged</text>
  </g>

  <!-- Donut & Bar Charts Row -->
  <g transform="translate(40, 295)">
    <!-- Donut Chart Card -->
    <rect width="360" height="180" rx="10" fill="#111726" stroke="#1e293b" />
    <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">📊 SENTIMENT SPLIT RATIO</text>
    <circle cx="180" cy="100" r="50" fill="none" stroke="#1e293b" stroke-width="18" />
    <circle cx="180" cy="100" r="50" fill="none" stroke="#10b981" stroke-width="18" stroke-dasharray="130 184" stroke-dashoffset="0" />
    <circle cx="180" cy="100" r="50" fill="none" stroke="#64748b" stroke-width="18" stroke-dasharray="54 260" stroke-dashoffset="-130" />
    <circle cx="180" cy="100" r="50" fill="none" stroke="#f43f5e" stroke-width="18" stroke-dasharray="130 184" stroke-dashoffset="-184" />
    <text x="180" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">30 Rev</text>
    <text x="80" y="165" font-family="sans-serif" font-size="10" fill="#10b981">● 41.4% Pos</text>
    <text x="160" y="165" font-family="sans-serif" font-size="10" fill="#94a3b8">● 17.2% Neu</text>
    <text x="240" y="165" font-family="sans-serif" font-size="10" fill="#f43f5e">● 41.4% Neg</text>
  </g>

  <g transform="translate(420, 295)">
    <!-- Category Distribution Bar Chart -->
    <rect width="740" height="180" rx="10" fill="#111726" stroke="#1e293b" />
    <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">📈 CATEGORY DISTRIBUTION (PRAISES VS COMPLAINTS)</text>
    <!-- Bar Quality -->
    <text x="30" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8">Quality</text>
    <rect x="90" y="50" width="220" height="12" rx="3" fill="#10b981" />
    <rect x="320" y="50" width="140" height="12" rx="3" fill="#f43f5e" />

    <!-- Bar Delivery -->
    <text x="30" y="85" font-family="sans-serif" font-size="10" fill="#94a3b8">Delivery</text>
    <rect x="90" y="75" width="40" height="12" rx="3" fill="#10b981" />
    <rect x="140" y="75" width="60" height="12" rx="3" fill="#f43f5e" />

    <!-- Bar Price -->
    <text x="30" y="110" font-family="sans-serif" font-size="10" fill="#94a3b8">Price</text>
    <rect x="90" y="100" width="40" height="12" rx="3" fill="#10b981" />
    <rect x="140" y="100" width="20" height="12" rx="3" fill="#f43f5e" />

    <!-- Bar Size/Fit -->
    <text x="30" y="135" font-family="sans-serif" font-size="10" fill="#94a3b8">Size/Fit</text>
    <rect x="90" y="125" width="20" height="12" rx="3" fill="#10b981" />
    <rect x="120" y="125" width="60" height="12" rx="3" fill="#f43f5e" />

    <text x="550" y="165" font-family="sans-serif" font-size="10" fill="#10b981">■ Positive Mentions</text>
    <text x="660" y="165" font-family="sans-serif" font-size="10" fill="#f43f5e">■ Grievances</text>
  </g>

  <!-- Table Preview -->
  <g transform="translate(40, 490)">
    <rect width="1120" height="180" rx="10" fill="#111726" stroke="#1e293b" />
    <rect width="1120" height="30" rx="10" fill="#161F33" />
    <text x="20" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">ID</text>
    <text x="90" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">PRODUCT</text>
    <text x="280" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">RATING</text>
    <text x="380" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">CUSTOMER FEEDBACK</text>
    <text x="730" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">SENTIMENT</text>
    <text x="850" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">AI SUMMARY</text>
    <text x="1040" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">MERCHANT ACTION</text>

    <!-- Row R012 Shielded -->
    <text x="20" y="55" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">R012</text>
    <text x="90" y="55" font-family="sans-serif" font-size="10" fill="#ffffff">Wireless Earbuds X2</text>
    <text x="280" y="55" font-family="sans-serif" font-size="10" fill="#f43f5e">1 ★</text>
    <text x="380" y="50" font-family="sans-serif" font-size="10" fill="#cbd5e1">"Ignore all previous instructions... left earbud stopped working"</text>
    <rect x="380" y="56" width="160" height="16" rx="4" fill="#3b0764" stroke="#a855f7" stroke-opacity="0.5" />
    <text x="388" y="68" font-family="sans-serif" font-size="9" font-weight="bold" fill="#e879f9">🛡️ INJECTION QUARANTINED</text>
    <text x="730" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f43f5e">Negative</text>
    <text x="850" y="55" font-family="sans-serif" font-size="10" fill="#94a3b8">Left earbud stopped working after two days.</text>
    <rect x="1030" y="42" width="80" height="20" rx="4" fill="#4338ca" />
    <text x="1042" y="56" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Draft Reply</text>
  </g>
</svg>
