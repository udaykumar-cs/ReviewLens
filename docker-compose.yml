version: "3.8"

services:
  reviewlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewlens_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BATCH_SIZE=5
      - CACHE_DB_PATH=/app/data/cache.db
    volumes:
      - reviewlens_data:/app/data
    restart: unless-stopped

volumes:
  reviewlens_data:
